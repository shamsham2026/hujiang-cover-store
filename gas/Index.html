<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>滬江小學 調課代課</title>
  <style>
    :root { color-scheme: light; --ink:#2a211c; --muted:#6d6258; --line:#e4d8cc; --paper:#f7f1e8; --card:#fffdf9; --seal:#8d2f2a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; background:var(--paper); color:var(--ink); }
    header { display:flex; gap:12px; align-items:center; padding:18px 16px 8px; }
    .seal { width:42px; height:42px; border-radius:8px; background:var(--seal); color:#fff; display:grid; place-items:center; font-family:serif; font-size:22px; }
    h1 { font-family:serif; font-size:22px; margin:0; font-weight:600; }
    header p { margin:2px 0 0; color:var(--muted); font-size:12px; }
    nav { display:flex; gap:6px; padding:8px 16px 0; }
    nav button { flex:1; border:1px solid var(--line); background:transparent; border-radius:999px; padding:8px; font:inherit; }
    nav button.active { background:var(--seal); color:#fff; border-color:var(--seal); }
    main { padding:16px; max-width:720px; margin:0 auto; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; }
    label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
    input, select { width:100%; border:1px solid var(--line); background:#fff; border-radius:10px; padding:10px 12px; font:inherit; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .go { width:100%; margin-top:14px; background:var(--seal); color:#fff; border:0; border-radius:12px; padding:12px; font:inherit; font-weight:600; }
    .slot { display:grid; grid-template-columns:4.5rem 1fr; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); }
    .slot b { font-weight:600; }
    .muted { color:var(--muted); font-size:12px; }
    .msg { margin-top:12px; padding:10px 12px; border-radius:10px; display:none; }
    .ok { background:#e7f4ea; }
    .bad { background:#fde8e4; }
    .note { font-size:12px; color:var(--muted); line-height:1.5; }
  </style>
</head>
<body>
  <header>
    <div class="seal">滬</div>
    <div>
      <h1>調課 · 代課</h1>
      <p>寫入這份試算表。查課、代課、對調。</p>
    </div>
  </header>
  <nav>
    <button class="active" data-tab="look">課表</button>
    <button data-tab="cover">代課</button>
    <button data-tab="swap">調課</button>
  </nav>
  <main>
    <section id="look" class="card">
      <div class="row">
        <div><label>日期</label><input id="lookDate" type="date"></div>
        <div><label>老師簡稱</label><input id="lookTeacher" placeholder="例如：淑"></div>
      </div>
      <button class="go" id="lookBtn">查看這一天</button>
      <div id="lookList"></div>
    </section>
    <section id="cover" class="card" hidden>
      <div class="row">
        <div><label>日期</label><input id="sDate" type="date"></div>
        <div><label>代課紙</label>
          <select id="sSlot">
            <option value="auto">自動找空白</option>
            <option value="1">左側</option>
            <option value="2">中間</option>
            <option value="3">右側</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div><label>請假老師簡稱</label><input id="sTeacher" placeholder="紅"></div>
        <div><label>原因</label>
          <select id="sReason">
            <option>病假</option><option>事假</option><option>覆診</option><option>帶隊</option>
            <option>會議</option><option>進修</option><option>IEP</option><option>其他</option>
          </select>
        </div>
      </div>
      <label>備註</label><input id="sReasonDetail" placeholder="例如：英文集誦訓練">
      <label>代課老師（教節:簡稱，逗號分隔）</label>
      <input id="sSubs" placeholder="1:曉, 2:曉, 放學:玉">
      <p class="note">課堂內容仍由試算表公式從最新課表帶出，這裡只寫日期、老師和代課人。</p>
      <button class="go" id="coverBtn">寫入代課表格</button>
      <div id="coverMsg" class="msg"></div>
    </section>
    <section id="swap" class="card" hidden>
      <div class="row">
        <div><label>原日期</label><input id="origDate" type="date"></div>
        <div><label>受調日期</label><input id="targetDate" type="date"></div>
      </div>
      <div class="row">
        <div><label>申請老師</label><input id="applicantTeacher" placeholder="羅"></div>
        <div><label>原教節</label><input id="period" placeholder="3 或 放學"></div>
      </div>
      <div class="row">
        <div><label>班別或崗位</label><input id="className" placeholder="6D 或 門"></div>
        <div><label>原課堂</label><input id="origLesson" placeholder="6D英文"></div>
      </div>
      <div class="row">
        <div><label>對調老師</label><input id="partnerTeacher" placeholder="健"></div>
        <div><label>受調節次</label><input id="partnerPeriod" placeholder="可留空"></div>
      </div>
      <label>受調課堂</label><input id="targetLesson" placeholder="6D圖書">
      <button class="go" id="swapBtn">寫入調課暫存</button>
      <div id="swapMsg" class="msg"></div>
    </section>
  </main>
  <script>
    var today = new Date();
    var iso = today.getFullYear() + "-" + String(today.getMonth()+1).padStart(2,"0") + "-" + String(today.getDate()).padStart(2,"0");
    ["lookDate","sDate","origDate","targetDate"].forEach(function(id){ document.getElementById(id).value = iso; });

    document.querySelectorAll("nav button").forEach(function(btn){
      btn.addEventListener("click", function(){
        document.querySelectorAll("nav button").forEach(function(b){ b.classList.remove("active"); });
        btn.classList.add("active");
        ["look","cover","swap"].forEach(function(id){ document.getElementById(id).hidden = id !== btn.dataset.tab; });
      });
    });

    function show(el, ok, text){ el.style.display="block"; el.className="msg " + (ok ? "ok" : "bad"); el.textContent=text; }

    document.getElementById("lookBtn").addEventListener("click", function(){
      var btn=this; btn.disabled=true; btn.textContent="查詢中…";
      google.script.run.withSuccessHandler(function(res){
        btn.disabled=false; btn.textContent="查看這一天";
        var box=document.getElementById("lookList");
        if(!res.slots || !res.slots.length){ box.innerHTML='<p class="note">這天沒有這位老師的課堂。</p>'; return; }
        box.innerHTML = res.slots.map(function(s){
          return '<div class="slot"><div><b>'+s.period+'</b></div><div>'+(s.className||"當值")+' '+s.course+'<div class="muted">'+(s.change||"原課")+'</div></div></div>';
        }).join("");
      }).withFailureHandler(function(err){
        btn.disabled=false; btn.textContent="查看這一天";
        document.getElementById("lookList").innerHTML='<p class="note">'+err.message+'</p>';
      }).getTeacherDay(document.getElementById("lookTeacher").value.trim(), document.getElementById("lookDate").value);
    });

    document.getElementById("coverBtn").addEventListener("click", function(){
      var btn=this; var msg=document.getElementById("coverMsg");
      btn.disabled=true;
      var substitutes=[];
      document.getElementById("sSubs").value.split(",").forEach(function(item){
        var parts=item.split(":");
        if(parts.length===2) substitutes.push({period:parts[0].trim(), subTeacher:parts[1].trim()});
      });
      google.script.run.withSuccessHandler(function(res){
        btn.disabled=false; show(msg, res.success, res.message);
      }).withFailureHandler(function(err){
        btn.disabled=false; show(msg, false, err.message);
      }).writeSubstituteTable({
        date: document.getElementById("sDate").value,
        slot: document.getElementById("sSlot").value,
        teacher: document.getElementById("sTeacher").value.trim(),
        reason: document.getElementById("sReason").value,
        reasonDetail: document.getElementById("sReasonDetail").value.trim(),
        substitutes: substitutes
      });
    });

    document.getElementById("swapBtn").addEventListener("click", function(){
      var btn=this; var msg=document.getElementById("swapMsg");
      btn.disabled=true;
      google.script.run.withSuccessHandler(function(res){
        btn.disabled=false; show(msg, res.success, res.message);
      }).withFailureHandler(function(err){
        btn.disabled=false; show(msg, false, err.message);
      }).swapLessonsBatch([{
        origDate: document.getElementById("origDate").value,
        targetDate: document.getElementById("targetDate").value || document.getElementById("origDate").value,
        period: document.getElementById("period").value.trim(),
        className: document.getElementById("className").value.trim(),
        origLesson: document.getElementById("origLesson").value.trim(),
        applicantTeacher: document.getElementById("applicantTeacher").value.trim(),
        partnerTeacher: document.getElementById("partnerTeacher").value.trim(),
        partnerPeriod: document.getElementById("partnerPeriod").value.trim(),
        targetLesson: document.getElementById("targetLesson").value.trim()
      }]);
    });
  </script>
</body>
</html>
